<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github issues | Home</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- tailwind and daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- stylesheet -->
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>
    <header class="sticky top-0 z-1">
        <nav>
            <div
                class="navbar flex flex-col md:flex-row gap-4 py-5 px-10 md:py-0 justify-between bg-base-100 shadow-sm">
                <div class="flex items-center gap-1">
                    <img class="h-9 w-8" src="assets/github-logo.png" alt="">
                    <h2 class="font-semibold text-2xl"><a href="">GitHub Issues Tracker</a></h2>
                </div>

                <div class="flex gap-5">
                    <div>
                        <label class="input validator join-item">
                            <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                                    stroke="currentColor">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.3-4.3"></path>
                                </g>
                            </svg>
                            <input type="text" name="text" placeholder="Search" required />
                        </label>
                    </div>
                    <div>
                        <button class="btn btn-primary"><i class="fa-solid fa-plus"></i>New Issue</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main class="w-[90%] mx-auto space-y-5">
        <!-- button -->
        <section class="space-y-4 mt-16">
            <div class="flex gap-3 bg-white shadow-md rounded-lg p-6">
                <button onclick = "loadAllIssues()" class="filter-btn btn" id="all-btn">All</button>
                <button class="filter-btn btn" id="open-btn">Open</button>
                <button class="filter-btn btn" id="close-btn">Closed</button>
            </div>

            <!--Issues -->
            <div class="flex justify-between bg-white shadow-md rounded-lg p-6">
                <!-- right division -->
                <div class="flex gap-2">
                    <div class=" p-2 bg-[#ECE4FF] rounded-full">
                        <img class="animate-spin" src="assets/Aperture.png" alt="">
                    </div>
                    <div>
                        <h2 class="font-semibold text-[#1F2937]">50 Issues</h2>
                        <p>Track and manage your project issues</p>
                    </div>
                </div>
                <!-- left division -->
                <div class="flex gap-4">
                    <!-- open -->
                    <div class="flex gap-1 items-center">
                        <div class="bg-[#00A96E] w-3 h-3 rounded-full"></div>
                        <p>Open</p>
                    </div>
                    <!-- close -->
                    <div class="flex gap-1 items-center">
                        <div class="bg-[#A855F7] w-3 h-3 rounded-full"></div>
                        <p>Closed</p>
                    </div>
                </div>
            </div>

        </section>

        
        <!-- cards -->
        <section class="min-h-screen shadow-md">
            <!-- spinner -->
            <div id="spinner" class="flex justify-center items-center py-10 hidden">
                <span class="loading loading-spinner loading-xl"></span>
            </div>


            <!-- card container -->
            <div id="card-container" class="grid gap-3 grid-cols-1 items-stretch md:grid-cols-2 lg:grid-cols-4 p-10 bg-[#FBFBFB] shadow-md">
                
            </div>
        </section>
        

    </main>
    <script src="./script/home.js"></script>
</body>
</html>
