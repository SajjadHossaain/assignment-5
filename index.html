<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub issues tracker</title>
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    
    <!-- tailwind and daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- stylesheet -->
     <link rel="stylesheet" href="./style/style.css">
</head>
<body class="min-h-screen max-w-md mx-auto py-20">
    <div class="card bg-base-200 shadow-2xl">

        <div class="flex justify-center py-8">
            <img src="assets/github-logo.png" alt="">
        </div>

        <div class="space-y-1 text-center">
            <h2 class="text-2xl font-semibold">GitHub Issues Tracker</h2>
            <p class="text-[#64748B]">Sign in to manage your issues</p>
        </div>

        <!-- form -->
        <div class="card w-full max-w-sm shrink-0 mx-auto">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-semibold text-[#1F2937] ">Username</label>
                    <input id="user-name" type="text" class="input w-full" placeholder="Enter Username" />
                    <label class="label font-semibold text-[#1F2937]">Password</label>
                    <input id="user-pin" type="password" class="input w-full" placeholder="Password" />
                    <button id="btn-sign" class="btn btn-primary mt-4">Sign In</button>
                </fieldset>
            </div>
        </div>

        <div class="space-y-6">
            <div class="flex items-center gap-4 mx-12">
                <div class="flex-1 border-t border-[#E4E4E7]"></div>
                <span>OR</span>
                <div class="flex-1 border-t border-[#E4E4E7]"></div>
            </div>

            <p class="text-[#64748B] text-center">Demo Credentials:</p>

            <div class="mb-8 text-center">
                <p><span class="font-bold">Username:</span> admin</p>
                <p><span class="font-bold">Password:</span> admin123</p>
            </div>
        </div>
    </div>

    <script src="./script/login.js"></script>
</body>
</html>
